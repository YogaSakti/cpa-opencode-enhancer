# opencode-enhancer plugin configuration example.
#
# EVERY key under opencode-enhancer is OPTIONAL and shown here at its default.
# A working install needs only:
#
#   plugins:
#     configs:
#       opencode-enhancer:
#         enabled: true
#
# The credential glue at the bottom of this file is NOT optional.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    opencode-enhancer:
      enabled: true
      priority: 100

      # --- Session header injection ---
      session:
        header_name: "x-opencode-session"
        source_headers:
          - X-Opencode-Session
          - Session-Id
          - Session_id
          - Thread-Id
          - Thread_id
          - X-Claude-Code-Session-Id
          - X-DeepSeek-Harness-Session-Id
          - X-Session-Affinity
          - X-Session-Id
          - X-Client-Request-Id
        hash_derived: true
        fallback_to_body_hash: true

      # --- User-Agent / client identity (non-fingerprint, i.e. paid, path only) ---
      user_agent:
        rewrite: true
        fallback_value: "coding-agent/1.0"  # dipakai saat UA client generic/kosong
        client_map:
          codex: "codex"
          claude: "claude-code"
          opencode: "opencode"
          generic: ""                   # kosong = header X-Opencode-Client di-omit
        outbound_header: "X-Opencode-User-Agent"
        set_user_agent_header: false

      # --- Free vs paid classification (gates the whole fingerprint) ---
      free_tier:
        markers: ["-free", ":free"]
        free_models: []               # nama eksak lain yang dianggap free
        paid_models: []               # nama eksak yang tidak pernah di-reshape

      # --- OpenCode Zen free-tier client fingerprint ---
      # The free tier gates on the WHOLE official-client fingerprint; a request
      # missing any one part is rejected with:
      #   403 "OpenCode's free tier can only be used from within OpenCode"
      # When it applies, this block overrides user_agent above.
      fingerprint:
        enabled: true
        user_agent: "opencode/1.18.31"   # must be opencode/>=1.17
        client: "desktop"                # X-Opencode-Client
        project: "global"                # X-Opencode-Project
        accept: "text/event-stream"      # "" = leave Accept alone
        force_stream: true               # stream:false -> 403, even with valid headers
        inject_tools: ["bash", "glob", "grep", "read"]
        strip_reasoning: true            # Responses: drop prior reasoning/encrypted_content
        strip_additional_tools: true     # Responses upstream: drop Codex additional_tools (400 otherwise)
        warn_missing_glue: true          # log the required credential headers: once per auth
        free_only: true                  # paid builds are never reshaped

      # --- Observability (default OFF) ---
      logging:
        enabled: false            # true = log tiap request yang di-shape ke CPA log

      # --- Target detection ---
      target:
        auth_prefixes:
          - "opencode"        # substring match on the host auth id
        models: []           # model globs; a codex-api-key credential (Muse) needs one: ["muse-*"]

# --- Credential glue (REQUIRED on every free-tier OpenCode credential) ---
# The plugin injects headers into the execution headers; built-in executors
# only send headers declared here with "$" references. A header the credential
# does not declare never reaches the wire, and a fingerprint missing one part
# is a 403.
#
# Endpoints: /zen/v1/* is a proxy to /inference/openai/v1/* for oc_sk_ keys
# (/zen/go/v1/* to /inference/go/openai/v1/*), so either prefix works as a
# base-url. Never include /chat/completions or /responses; the executor adds it.
#   https://opencode.ai/zen/v1  (= /inference/openai/v1)   chat + Responses (Muse)
#   https://opencode.ai/zen/go/v1  (= /inference/go/openai/v1)   Go subscription
#   https://opencode.ai/inference/v1/models   catalog only
# Keys look like oc_sk_… ; old sk-… keys were revoked.
#
# openai-compatibility:
#   # FREE credential -- keep it free-only so aliases stay unambiguous.
#   - name: "Opencode Free"
#     base-url: "https://opencode.ai/inference/openai/v1"
#     headers:
#       User-Agent: "$X-Opencode-User-Agent"
#       X-Opencode-Session: "$X-Opencode-Session"
#       X-Opencode-Client: "$X-Opencode-Client"
#       X-Opencode-Project: "$X-Opencode-Project"
#       X-Opencode-Request: "$X-Opencode-Request"
#       Accept: "$Accept"
#     api-key-entries:
#       - api-key: "${OPENCODE_API_KEY}"
#     models:
#       - name: "mimo-v2.5-free"
#         alias: ""
#       - name: "nemotron-3-ultra-free"
#         alias: ""
#
#   # PAID credential -- never fingerprinted; zen/go/v1 only needs the session.
#   - name: "Opencode Paid"
#     base-url: "https://opencode.ai/zen/go/v1"
#     headers:
#       X-Opencode-Session: "$X-Opencode-Session"
#     api-key-entries:
#       - api-key: "${OPENCODE_API_KEY}"
#     models:
#       - name: "glm-5.3"
#         alias: ""
#
# Muse is Responses-only: it needs a codex-api-key credential (posts to
# <base-url>/responses) plus target.models: ["muse-*"] above, because a
# codex-api-key auth id ("codex:apikey:<hash>") names no provider.
# disable-codex-cloaking per credential needs CLIProxyAPI >= 7.3.17.
#
# codex-api-key:
#   - api-key: "${OPENCODE_API_KEY}"
#     base-url: "https://opencode.ai/zen/v1"   # no /responses suffix
#     disable-codex-cloaking: true
