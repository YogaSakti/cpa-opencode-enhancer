# opencode-enhancer plugin configuration example.
#
# EVERY key under opencode-enhancer is OPTIONAL and shown here at its default.
# A working install needs only:
#
#   plugins:
#     configs:
#       opencode-enhancer:
#         enabled: true
#
# The credential glue at the bottom of this file is NOT optional.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    opencode-enhancer:
      enabled: true
      priority: 100

      # --- Session header injection ---
      session:
        header_name: "x-opencode-session"
        source_headers:
          - X-Opencode-Session
          - Session-Id
          - Session_id
          - Thread-Id
          - Thread_id
          - X-Claude-Code-Session-Id
          - X-DeepSeek-Harness-Session-Id
          - X-Session-Affinity
          - X-Session-Id
          - X-Client-Request-Id
        hash_derived: true
        fallback_to_body_hash: true
        fallback_to_request_id: false

      # --- User-Agent / client identity ---
      user_agent:
        rewrite: true
        mode: "passthrough"              # passthrough | static | map | template
        value: ""                        # static mode: explicit UA for every request
        template: ""                     # template mode: "{name}/{version} (via cliproxy)"
        fallback_value: "coding-agent/1.0"  # UA saat client UA generic/kosong (netral, tanpa label proxy)
        custom_ua:                       # map mode / fallback per-client override
          codex: "codex-cli/1.0"
          claude: "claude-code/1.0"
          opencode: "opencode/1.0"
          default: "coding-agent/1.0"
        generic_patterns: []             # extra UA substrings treated as generic
        client_map:
          codex: "codex"
          claude: "claude-code"
          opencode: "opencode"
          generic: ""                   # kosong = header X-Opencode-Client di-omit (anti-deteksi)
        outbound_header: "X-Opencode-User-Agent"
        set_user_agent_header: false

      # --- Zen free-tier body cleanup ---
      body_cleanup:
        strip_additional_tools: true
        free_markers: ["-free", ":free"]  # dynamic free-tier detection
        zen_free_models: []               # extra exact names treated as free
        zen_paid_models: []               # exact names never stripped (guard)
        strip_types: ["additional_tools"] # input[] entry types to drop

      # --- OpenCode Zen free-tier client fingerprint ---
      # The free tier gates on the WHOLE official-client fingerprint; a request
      # missing any one part is rejected with:
      #   403 "OpenCode's free tier can only be used from within OpenCode"
      # When it applies, this block overrides user_agent above.
      fingerprint:
        enabled: true
        user_agent: "opencode/1.18.31"   # must be opencode/>=1.17
        client: "desktop"                # X-Opencode-Client
        project: "global"                # X-Opencode-Project
        accept: "text/event-stream"      # "" = leave Accept alone
        force_stream: true               # stream:false -> 403, even with valid headers
        inject_tools: ["bash", "glob", "grep", "read"]
        strip_reasoning: true            # Responses: drop prior reasoning/encrypted_content
        free_only: true                  # paid builds are never reshaped

      # --- Observability (default OFF) ---
      logging:
        enabled: false            # true = log tiap request yang di-shape ke CPA log

      # --- Target detection ---
      target:
        base_url_markers:
          - "opencode.ai"
        auth_prefixes:
          - "opencode"        # substring match on the host auth id
        models: []           # optional model globs, e.g. ["muse-*"]

# --- Credential glue (REQUIRED on every OpenCode credential) ---
# The plugin injects headers into the execution headers; built-in executors
# only send headers declared here with "$" references.
#
# X-Opencode-Project and X-Opencode-Request are part of the free-tier
# fingerprint and MUST be declared too, or the plugin's values never reach
# the wire.
#
# openai-compatibility:
#   - name: "opencode-go"
#     base-url: "https://opencode.ai/zen/go/v1"
#     headers:
#       User-Agent: "$X-Opencode-User-Agent"
#       X-Opencode-Session: "$X-Opencode-Session"
#       X-Opencode-Client: "$X-Opencode-Client"
#       X-Opencode-Project: "$X-Opencode-Project"
#       X-Opencode-Request: "$X-Opencode-Request"
#       Accept: "$Accept"
#     api-key-entries:
#       # Free tier uses the pooled public key, not a personal key.
#       - api-key: "public"
#     models:
#       - name: "mimo-v2.5-free"
#         alias: "mimo-v2.5-free"
#
