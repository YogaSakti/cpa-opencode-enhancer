# opencode-enhancer plugin configuration example.
#
# EVERY key under opencode-enhancer is OPTIONAL and shown here at its default.
# A working install needs only:
#
#   plugins:
#     configs:
#       opencode-enhancer:
#         enabled: true
#
# The credential glue at the bottom of this file is NOT optional.

plugins:
  enabled: true
  dir: "plugins"
  configs:
    opencode-enhancer:
      enabled: true
      priority: 100

      # --- Session header injection ---
      session:
        header_name: "x-opencode-session"
        source_headers:
          - X-Opencode-Session
          - Session-Id
          - Session_id
          - Thread-Id
          - Thread_id
          - X-Claude-Code-Session-Id
          - X-DeepSeek-Harness-Session-Id
          - X-Session-Affinity
          - X-Session-Id
          - X-Client-Request-Id
        hash_derived: true
        fallback_to_body_hash: true

      # --- User-Agent / client identity (non-fingerprint, i.e. paid, path only) ---
      user_agent:
        rewrite: true
        fallback_value: "coding-agent/1.0"  # dipakai saat UA client generic/kosong
        client_map:
          codex: "codex"
          claude: "claude-code"
          opencode: "opencode"
          generic: ""                   # kosong = header X-Opencode-Client di-omit
        outbound_header: "X-Opencode-User-Agent"
        set_user_agent_header: false

      # --- Free vs paid classification (gates the whole fingerprint) ---
      free_tier:
        markers: ["-free", ":free"]
        free_models: []               # nama eksak yang dianggap free
        paid_models: []               # nama eksak yang tidak pernah di-reshape

      # --- OpenCode Zen free-tier client fingerprint ---
      # The free tier gates on the WHOLE official-client fingerprint; a request
      # missing any one part is rejected with:
      #   403 "OpenCode's free tier can only be used from within OpenCode"
      # When it applies, this block overrides user_agent above.
      fingerprint:
        enabled: true
        user_agent: "opencode/1.18.31"   # must be opencode/>=1.17
        client: "desktop"                # X-Opencode-Client
        project: "global"                # X-Opencode-Project
        accept: "text/event-stream"      # "" = leave Accept alone
        force_stream: true               # stream:false -> 403, even with valid headers
        inject_tools: ["bash", "glob", "grep", "read"]
        strip_reasoning: true            # Responses: drop prior reasoning/encrypted_content
        warn_missing_glue: true          # log the required credential headers: once per auth
        free_only: true                  # paid builds are never reshaped

      # --- Observability (default OFF) ---
      logging:
        enabled: false            # true = log tiap request yang di-shape ke CPA log

      # --- Target detection ---
      target:
        base_url_markers:
          - "opencode.ai"
        auth_prefixes:
          - "opencode"        # substring match on the host auth id
        models: []           # optional model globs, e.g. ["muse-*"]

# --- Credential glue (REQUIRED on every free-tier OpenCode credential) ---
# The plugin injects headers into the execution headers; built-in executors
# only send headers declared here with "$" references. A header the credential
# does not declare never reaches the wire, and a fingerprint missing one part
# is a 403.
#
# Endpoints (verified 2026-09-19): catalog and inference live at different
# prefixes on the current host, so no single base-url serves both.
#   https://opencode.ai/inference/openai/v1   /models 404, /chat/completions 200  <- use this
#   https://opencode.ai/inference/v1          /models 200, /chat/completions 404
#   https://opencode.ai/zen/v1                both 200, separate free quota bucket
#   https://opencode.ai/zen/go/v1             both 200, needs x-opencode-session
# The 404 is harmless: CLIProxyAPI serves from the credential's own models: list.
# Keys: old sk-… keys were revoked; current keys look like oc_sk_… .
#
# openai-compatibility:
#   # FREE credential -- keep it free-only so aliases stay unambiguous.
