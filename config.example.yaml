#       X-Opencode-Session: "$X-Opencode-Session"
#       X-Opencode-Project: "$X-Opencode-Project"
#       X-Opencode-Request: "$X-Opencode-Request"
#       Accept: "$Accept"
#     models:
#       - name: "muse-spark-1.3-contributor-free"
#         alias: ""
